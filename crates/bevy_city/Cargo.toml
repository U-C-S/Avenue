[package]
name = "bevy_city"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.20.0", features = [
  "https",
  "free_camera",
  "bevy_feathers",
  "web_asset_cache",
  "bevy_dev_tools",
] }

argh = "0.1"
noise = "0.9.0"
rand = "^0.10.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
